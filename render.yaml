services:
  - type: web
    name: realtime-playlist
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: playlist-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: playlist-db
    databaseName: playlist
    user: playlist
