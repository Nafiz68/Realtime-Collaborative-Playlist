services:
  - type: web
    name: realtime-playlist
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    disk:
      name: sqlite-data
      mountPath: /opt/render/project/src/prisma
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: file:/opt/render/project/src/prisma/prod.db
      - key: NODE_ENV
        value: production
